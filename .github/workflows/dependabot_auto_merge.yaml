name: Dependabot auto-merge

on:
  workflow_run:
    types:
      - completed
    workflows:
      - CI

jobs:
  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Auto-merge
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        uses: ridedott/merge-me-action@13658bbbf17a2a34b19b4c608eeb3a63d3a72137 # v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRESET: DEPENDABOT_MINOR
          MERGE_METHOD: MERGE

